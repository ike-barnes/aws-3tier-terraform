---
# ------------------------------------------------------------------
# CIS-aligned hardening baseline for the golden AMI.
# A focused subset of CIS Amazon Linux 2023 Benchmark controls, not a
# full benchmark implementation. Each task name says what it hardens.
# ------------------------------------------------------------------
- name: Harden the golden AMI
  hosts: all
  connection: local
  become: true

  tasks:
    # ---------------- Patching and packages ----------------
    - name: Apply all available updates
      ansible.builtin.dnf:
        name: "*"
        state: latest

    - name: Install the app's packages so servers boot with no downloads
      ansible.builtin.dnf:
        name:
          - nginx
          - postgresql16
          - jq
          - audit
          - chrony
        state: present

    - name: Enable nginx at boot
      ansible.builtin.systemd:
        name: nginx
        enabled: true

    # ---------------- SSH ----------------
    # Named 01- so it loads before the distribution's defaults (first match wins).
    - name: "CIS-aligned: harden SSH (no root login, no passwords, no X11)"
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/01-cis-hardening.conf
        owner: root
        group: root
        mode: "0600"
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          PermitEmptyPasswords no
          X11Forwarding no
          MaxAuthTries 4
          LoginGraceTime 60
          ClientAliveInterval 300
          ClientAliveCountMax 3
          Banner /etc/issue.net
        validate: /usr/sbin/sshd -t -f %s

    # ---------------- Kernel and network ----------------
    - name: "CIS-aligned: network and kernel parameters"
      ansible.builtin.copy:
        dest: /etc/sysctl.d/60-cis-hardening.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          net.ipv4.ip_forward = 0
          net.ipv4.conf.all.send_redirects = 0
          net.ipv4.conf.default.send_redirects = 0
          net.ipv4.conf.all.accept_redirects = 0
          net.ipv4.conf.default.accept_redirects = 0
          net.ipv4.conf.all.secure_redirects = 0
          net.ipv4.conf.default.secure_redirects = 0
          net.ipv4.conf.all.accept_source_route = 0
          net.ipv4.conf.default.accept_source_route = 0
          net.ipv4.conf.all.log_martians = 1
          net.ipv4.conf.default.log_martians = 1
          net.ipv4.icmp_echo_ignore_broadcasts = 1
          net.ipv4.icmp_ignore_bogus_error_responses = 1
          net.ipv4.tcp_syncookies = 1
          kernel.randomize_va_space = 2
          fs.suid_dumpable = 0

    - name: Load the kernel parameters now
      ansible.builtin.command: sysctl --system
      changed_when: false

    - name: "CIS-aligned: disable core dumps"
      ansible.builtin.copy:
        dest: /etc/security/limits.d/60-cis-core-dumps.conf
        mode: "0644"
        content: |
          * hard core 0

    - name: "CIS-aligned: disable unused filesystem modules"
      ansible.builtin.copy:
        dest: /etc/modprobe.d/60-cis-filesystems.conf
        mode: "0644"
        content: |
          install cramfs /bin/false
          install freevxfs /bin/false
          install hfs /bin/false
          install hfsplus /bin/false
          install jffs2 /bin/false
          install udf /bin/false

    # ---------------- Auditing ----------------
    - name: "CIS-aligned: audit changes to identity, privilege, and SSH files"
      ansible.builtin.copy:
        dest: /etc/audit/rules.d/60-cis-identity.rules
        owner: root
        group: root
        mode: "0640"
        content: |
          -w /etc/passwd -p wa -k identity
          -w /etc/group -p wa -k identity
          -w /etc/shadow -p wa -k identity
          -w /etc/gshadow -p wa -k identity
          -w /etc/sudoers -p wa -k privilege
          -w /etc/sudoers.d/ -p wa -k privilege
          -w /etc/ssh/sshd_config -p wa -k sshd
          -w /etc/ssh/sshd_config.d/ -p wa -k sshd

    - name: Enable the audit daemon at boot
      ansible.builtin.systemd:
        name: auditd
        enabled: true

    - name: Enable time synchronization at boot
      ansible.builtin.systemd:
        name: chronyd
        enabled: true

    # ---------------- File permissions and banner ----------------
    - name: "CIS-aligned: restrict permissions on account files"
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: /etc/passwd, mode: "0644" }
        - { path: /etc/group, mode: "0644" }
        - { path: /etc/shadow, mode: "0000" }
        - { path: /etc/gshadow, mode: "0000" }

    - name: "CIS-aligned: login warning banner"
      ansible.builtin.copy:
        dest: "{{ item }}"
        mode: "0644"
        content: |
          Authorized use only. All activity may be monitored and reported.
      loop:
        - /etc/issue
        - /etc/issue.net

    # ---------------- Build record ----------------
    - name: Record what this image is and when it was built
      ansible.builtin.copy:
        dest: /etc/golden-ami-release
        mode: "0644"
        content: |
          image=three-tier-golden
          built={{ ansible_date_time.iso8601 }}
          base_os={{ ansible_distribution }} {{ ansible_distribution_version }}
          architecture={{ ansible_architecture }}
          baseline=CIS-aligned subset (ansible/harden.yml)
